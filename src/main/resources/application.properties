spring.application.name=demo
payroll.stale-deletion.cron=0 * * * * ?
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spring_boot_demo?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:demo}
spring.datasource.password=${DB_PASSWORD:demo}
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
spring.quartz.properties.org.quartz.jobStore.useProperties=true
